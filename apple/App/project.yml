# GymFree: generate the Xcode project with `xcodegen` (brew install xcodegen) from this folder.
name: GymFree
options:
  bundleIdPrefix: com.gsomovic
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 768BZ9W5AR
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    STRING_CATALOG_GENERATE_SYMBOLS: NO
packages:
  OpenGymCore:
    path: ../OpenGymCore
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    from: 4.5.2
targets:
  GymFree:
    type: application
    platform: iOS
    sources:
      - path: GymFree
        excludes: [Animations]
      - path: Shared
      # The privacy policy, shown in Settings → About (also the App Store privacy-policy URL).
      - path: ../PRIVACY.md
        buildPhase: resources
      # GymFree's own exercise animations (apple/anim/build.py), committed.
      - path: GymFree/Animations
        type: folder
        buildPhase: resources
      # Free, openly licensed exercise media (../mediatools/fetch_free.py), not committed.
      - path: ../Media/Free
        type: folder
        buildPhase: resources
      # The ExerciseDB animations: fetched by ../core/fetch-media.sh, never committed.
      - path: ../Media/ExerciseGIFs
        type: folder
        buildPhase: resources
    dependencies:
      - package: OpenGymCore
      - package: Lottie
      - target: GymFreeWidgets
    preBuildScripts:
      - name: Check exercise media
        basedOnDependencyAnalysis: false
        script: |
          n=$(ls "$SRCROOT/../Media/ExerciseGIFs" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$n" -lt 1300 ]; then
            echo "error: exercise animations missing ($n found). Run apple/core/fetch-media.sh first."
            exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gsomovic.gymfree
        PRODUCT_NAME: GymFree
        INFOPLIST_KEY_CFBundleDisplayName: GymFree
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSAlarmKitUsageDescription: "GymFree rings when a rest is over, even in silent mode, so you know when to start your next set."
  GymFreeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GymFreeWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gsomovic.gymfree.widgets
        PRODUCT_NAME: GymFreeWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GymFree
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        SKIP_INSTALL: YES
    info:
      path: GymFreeWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  GymFreeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GymFreeUITests]
    dependencies:
      - target: GymFree
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gsomovic.gymfree.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GymFree
schemes:
  GymFree:
    build:
      targets:
        GymFree: all
        GymFreeUITests: [test]
    test:
      targets: [GymFreeUITests]
